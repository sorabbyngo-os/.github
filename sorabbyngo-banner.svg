<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="pt pd">
  <title id="pt">Sorabbyngo</title>
  <desc id="pd">Sorabbyngo, a deep technology lab building for everyone. Six organizations (OS, Cloud, Vector, Search, People, Health) orbit a central core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080608"/>
      <stop offset="1" stop-color="#170a2b"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AA66FF"/>
      <stop offset="0.65" stop-color="#6C3FC4"/>
      <stop offset="1" stop-color="#FF6B35"/>
    </linearGradient>
    <radialGradient id="gP">
      <stop offset="0" stop-color="#AA66FF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#AA66FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gO">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="420" rx="24"/></clipPath>
  </defs>
  <style>
    .t { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    @keyframes rise  { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes dash  { to { stroke-dashoffset: -40; } }
    .a1 { opacity: 0; animation: rise 0.9s ease-out 0.2s forwards; }
    .a2 { opacity: 0; animation: rise 0.9s ease-out 0.5s forwards; }
    .a3 { opacity: 0; animation: rise 0.9s ease-out 0.8s forwards; }
    .a4 { opacity: 0; animation: rise 0.9s ease-out 1.1s forwards; }
    .ring { fill: none; stroke: #AA66FF; stroke-width: 1.4; stroke-dasharray: 5 8; opacity: 0.5; animation: dash 3s linear infinite; }
    .core { animation: pulse 3.5s ease-in-out infinite; }
    .node  { fill: #1b0f33; stroke: #AA66FF; stroke-width: 2; }
    .nodeO { fill: #2a1208; stroke: #FF6B35; stroke-width: 2.5; }
    .lbl { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <circle cx="900" cy="210" r="300" fill="url(#gP)"/>
    <circle cx="900" cy="210" r="110" fill="url(#gO)" class="core"/>

    <circle class="ring" cx="900" cy="210" r="150"/>
    <circle class="ring" cx="900" cy="210" r="195" opacity="0.25"/>

    <!-- core -->
    <circle cx="900" cy="210" r="48" fill="#130b21" stroke="#FF6B35" stroke-width="3"/>
    <text class="t lbl" x="900" y="210" style="font-size:12px">SORABBYNGO</text>

    <!-- orbiting organisations; text counter-rotates so labels stay upright -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 900 210" to="360 900 210" dur="48s" repeatCount="indefinite"/>

      <circle class="nodeO" cx="900" cy="60" r="31"/>
      <text class="t lbl" x="900" y="60">OS
        <animateTransform attributeName="transform" type="rotate" from="0 900 60" to="-360 900 60" dur="48s" repeatCount="indefinite"/>
      </text>

      <circle class="node" cx="1029.9" cy="135" r="31"/>
      <text class="t lbl" x="1029.9" y="135">Cloud
        <animateTransform attributeName="transform" type="rotate" from="0 1029.9 135" to="-360 1029.9 135" dur="48s" repeatCount="indefinite"/>
      </text>

      <circle class="node" cx="1029.9" cy="285" r="31"/>
      <text class="t lbl" x="1029.9" y="285">Vector
        <animateTransform attributeName="transform" type="rotate" from="0 1029.9 285" to="-360 1029.9 285" dur="48s" repeatCount="indefinite"/>
      </text>

      <circle class="node" cx="900" cy="360" r="31"/>
      <text class="t lbl" x="900" y="360">Search
        <animateTransform attributeName="transform" type="rotate" from="0 900 360" to="-360 900 360" dur="48s" repeatCount="indefinite"/>
      </text>

      <circle class="node" cx="770.1" cy="285" r="31"/>
      <text class="t lbl" x="770.1" y="285">People
        <animateTransform attributeName="transform" type="rotate" from="0 770.1 285" to="-360 770.1 285" dur="48s" repeatCount="indefinite"/>
      </text>

      <circle class="node" cx="770.1" cy="135" r="31"/>
      <text class="t lbl" x="770.1" y="135">Health
        <animateTransform attributeName="transform" type="rotate" from="0 770.1 135" to="-360 770.1 135" dur="48s" repeatCount="indefinite"/>
      </text>
    </g>

    <text class="t a1" x="70" y="108" font-size="14" font-weight="700" letter-spacing="7" fill="#FF6B35">OPEN SOURCE · BUILT FOR EVERYONE</text>
    <text class="t a2" x="66" y="206" font-size="96" font-weight="800" letter-spacing="6" fill="url(#title)">SORABBYNGO</text>
    <text class="t a3" x="70" y="262" font-size="26" fill="#EADFFF">Building the OS that thinks, feels, and speaks.</text>
    <text class="t a4" x="70" y="304" font-size="18" font-style="italic" fill="#AA66FF">A deep technology lab building for everyone.</text>
    <text class="t" x="70" y="372" font-size="13" fill="#8a78b5" letter-spacing="2">RHYTHM OF DIGITAL LIFE</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="24" fill="none" stroke="#6C3FC4" stroke-opacity="0.6" stroke-width="1.5"/>
</svg>
